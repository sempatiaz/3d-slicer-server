services:
  - type: web
    name: 3d-slicer-server
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: SLICER_TIMEOUT
        value: "240"
      - key: DOWNLOAD_TIMEOUT
        value: "180"
